name: License ALF
on:
  workflow_dispatch: {}
jobs:
  alf:
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:ubuntu-2022.3.4f1-android-3
    steps:
      - name: Generate alf
        run: |
          mkdir -p /root/.local/share/unity3d/Unity
          /opt/unity/Editor/Unity -quit -batchmode -nographics -createManualActivationFile -logFile /tmp/alf.log || true
          find / -name "*.alf" -mmin -15 2>/dev/null | head
          cp "$(find / -name '*.alf' -mmin -15 2>/dev/null | head -1)" /tmp/Unity_v2022.alf || true
          tail -40 /tmp/alf.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: unity-alf
          path: /tmp/Unity_v2022.alf
          if-no-files-found: warn
