name: License ALF
on:
  workflow_dispatch: {}
jobs:
  alf:
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:ubuntu-2022.3.4f1-android-3
    steps:
      - name: Probe licensing client capabilities
        run: |
          LC=/opt/unity/Editor/Data/Resources/Licensing/Client/Unity.Licensing.Client
          echo "=== --help ==="; "$LC" --help 2>&1 | head -60 || true
          echo "=== version ==="; "$LC" --version 2>&1 | head -5 || true
          echo "=== activate-license? ==="; "$LC" --activate-license --help 2>&1 | head -20 || true
          echo "=== editor -force-free ==="
          /opt/unity/Editor/Unity -quit -batchmode -nographics -force-free -logFile /tmp/ff.log || true
          grep -iE "licen|ulf|entitle" /tmp/ff.log | head -10 || true
