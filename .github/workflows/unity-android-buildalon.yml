name: unity-android-buildalon

# Stacklands 移植 · Buildalon 路线（Personal 许可证, 无需 .ulf）
# 与 GameCI 的区别: 激活走 Unity 官方 CLI / Licensing Client 的账号认证,
# 只要 UNITY_USERNAME(=邮箱) + UNITY_PASSWORD 两个 secret, 不需要 UNITY_LICENSE。
# 引擎 2022.3.4f1 / Android / IL2CPP / arm64-v8a 由工程 ProjectSettings 决定。

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Assets/**'
      - 'ProjectSettings/**'
      - '.github/workflows/unity-android-buildalon.yml'

env:
  UNITY_VERSION: 2022.3.4f1
  BUILD_TARGET: Android
  PROJECT_PATH: .
  BUILD_PATH: builds/android
  STRICT: "0"          # 首次冒烟构建走非严格; 稳定后改 "1" 并切 PortBuild.StrictBuild

jobs:
  build-android:
    name: Android IL2CPP (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: 腾出磁盘（镜像约 8GB，托管 runner 默认会不够）
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 构建（GameCI 官方镜像 + 账号激活，无 ulf）
        env:
          UNITY_USERNAME: ${{ secrets.UNITY_USERNAME || secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          IMG="unityci/editor:2022.3.4f1-android-3"
          docker pull "$IMG"
          docker run --rm --user root \
            -e UNITY_USERNAME -e UNITY_PASSWORD \
            -e STRICT -e BUILD_PATH \
            -v "$GITHUB_WORKSPACE":/project \
            -w /project \
            "$IMG" bash -lc '
              set -euo pipefail
              LIC=/opt/unity/Editor/Data/Resources/Licensing/Client/Unity.Licensing.Client
              echo "==> activate via credentials (--activate-all --include-personal)"
              "$LIC" --activate-all --include-personal \
                --username "$UNITY_USERNAME" --password "$UNITY_PASSWORD" --debug || {
                  echo "activate-all FAILED"; exit 5; }
              echo "==> entitlements"
              "$LIC" --showEntitlements || true
              ls -l "$HOME/.local/share/unity3d/Unity/" || true
              echo "==> build"
              /opt/unity/Editor/Unity -batchmode -nographics -quit \
                -buildTarget Android \
                -executeMethod PortBuild.PerformAndroidBuild \
                -buildPath "$BUILD_PATH" \
                -logFile /dev/stdout
            '

      - name: 校验产物
        if: always()
        run: |
          ls -lh "$BUILD_PATH" 2>/dev/null || echo "no build dir"
          test -f "$BUILD_PATH"/*.apk && echo "APK OK" || echo "APK MISSING"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Stacklands-android-apk
          path: |
            ${{ env.BUILD_PATH }}
            Logs
          if-no-files-found: warn
          retention-days: 14
