name: unity-android-il2cpp

# Stacklands 移植 · GitHub Actions + GameCI
# 引擎锁定 2022.3.4f1, 目标 Android IL2CPP (arm64-v8a)
# 说明: 带 <...> 的值需按仓库实际填写; 密钥走 GitHub Secrets, 不要入库。

on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Debug / Release"
        default: "Release"
        type: choice
        options: [ Debug, Release ]

env:
  UNITY_VERSION: 2022.3.4f1
  BUILD_TARGET: Android
  IL2CPP: true
  ARCH: arm64-v8a
  PROJECT_PATH: .
  BUILD_PATH: builds/android
  # 源数据目录(原版 .assets / Managed / DLC bundle)。原版版权二进制不入库,
  # 通过 CI artifact 或受保护目录注入; 留空则跳过依赖源数据的扫描。
  SOURCE_DATA: source/Stacklands_Data
  SOURCE_RAW: source/raw
  DECOMPILED_SRC: Assets/Scripts
  # 移植包配置(原版值未解出前用占位/默认; 由仓库 Variables 覆盖, 不改工作流)
  BUNDLE_IDENTIFIER: ${{ vars.BUNDLE_IDENTIFIER || 'com.sokpop.stacklands.port' }}
  SCREEN_ORIENTATION: ${{ vars.SCREEN_ORIENTATION || 'LandscapeLeft' }}
  MIN_SDK: ${{ vars.MIN_SDK || '26' }}
  TARGET_SDK: ${{ vars.TARGET_SDK || 'auto' }}
  # 严格模式总开关: PortBuild.StrictBuild 无视它全门必过, 这里供日志审计/产物审计对齐口径。
  STRICT: "1"
  STRICT_WARNINGS: "1"
  # 警告基线: 原版脚本 CS0169/CS0649、占位包名与调试签名提示共 11 条, 属已知不可消除项。
  # 超出基线即视为本次改动新引入的警告, 仍然失败。
  STRICT_MAX_WARNINGS: "12"
  # 日志审计基线: 原版脚本 CS0169/CS0649 在多次编译趟里重复出现, 实测 30 条; 超出即失败。
  LOG_WARNINGS_BASELINE: "30"
  STRICT_MIN_CUSTOM_SHADERS: "20"


concurrency:
  group: unity-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: 静态分析与台账提取
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.recon.outputs.ready }}
      project_ready: ${{ steps.preflight.outputs.project_ready }}
      license_ready: ${{ steps.preflight.outputs.license_ready }}
    steps:
      - uses: actions/checkout@v4

      # 构建前置探测: 工程是否已落地 (ProjectSettings/ProjectVersion.txt)、
      # Unity PERSONAL 账号密钥是否已配置 (UNITY_EMAIL / UNITY_PASSWORD)。
      # 未就绪则 build-android 自动跳过, 不产生无意义的红叉。
      - name: Preflight (project & license readiness)
        id: preflight
        continue-on-error: true
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          # 逐项检查首跑前提(引擎版本/场景/场景顺序/link.xml/依赖清单/PortBuild/shader/脚本/密钥/签名),
          # 并把明细写进 Step Summary —— 让"为什么不能构建"在 CI 首页就能看到, 而不是只看一个 false。
          python3 tools/preflight_project.py --root . --json-out preflight.json || true
          pr=true; [ -f ProjectSettings/ProjectVersion.txt ] || pr=false
          lr=false; if [ -n "$UNITY_LICENSE" ] || { [ -n "$UNITY_SERIAL" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; }; then lr=true; fi
          echo "project_ready=$pr" >> "$GITHUB_OUTPUT"
          echo "license_ready=$lr" >> "$GITHUB_OUTPUT"
          echo "verdict=$(jq -r .verdict preflight.json)" >> "$GITHUB_OUTPUT"
          echo "project_ready=$pr license_ready=$lr"

      # 审计脚本自测: 构建 job 在工程未落地时会被跳过, 若审计逻辑本身写错(例如 ABI 解析恒为空)
      # 就会永远绿 —— 所以把 verify_apk / strict_log_audit 的判定用合成样本钉死在 CI 里。
      # C# 编辑器脚本静态门: 没有编译器的环境里, 拦住"缺 using / 用了不存在的成员 / 括号不配对"这类
      # 必编译不过的问题(三者都真实发生过)。API 白名单 = docs/api_verified.json(逐条附文档页)。
      - name: C# editor script static gate
        run: |
          shopt -s nullglob
          files=(Assets/Editor/*.cs)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::Assets/Editor 下没有构建脚本"; exit 1; fi
          for f in "${files[@]}"; do
            echo "--- lint $f"
            python3 tools/lint_unity_api_usage.py --file "$f" --strict-unused
          done

      - name: Strict audit self-test
        run: python3 tools/selftest_strict.py

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanner deps
        run: pip install UnityPy dnfile

      # 可选: 原始上传件分卷拼接/侧车归位。仅当 SOURCE_RAW 有原始压缩包时执行。
      - name: Reconstruct source (optional)
        id: recon
        if: hashFiles(env.SOURCE_RAW) != ''
        run: |
          python3 tools/reconstruct_source.py \
            --in "$SOURCE_RAW" --out source/recon
          echo "ready=$(jq -r .ready source/recon/reconstruct_report.json)" >> "$GITHUB_OUTPUT"

      - name: Static scan (assets metadata)
        if: hashFiles(env.SOURCE_DATA) != ''
        run: |
          python3 tools/scan_static.py \
            --data "$SOURCE_DATA" \
            --managed "$SOURCE_DATA/Managed" \
            --out docs/scan_report.md \
            --json docs/scan_report.json

      - name: Blocked subsystem / native PInvoke metadata scan
        if: hashFiles(env.SOURCE_DATA) != ''
        run: |
          python3 tools/scan_blocked_metadata.py \
            --managed "$SOURCE_DATA/Managed" \
            --out blocked_metadata

      - name: Platform service references (Steam / Google)
        if: hashFiles(env.SOURCE_DATA) != ''
        run: |
          python3 tools/scan_platform_refs.py \
            --managed "$SOURCE_DATA/Managed" \
            --out platform_refs

      - name: Game assembly type inventory
        if: hashFiles(env.SOURCE_DATA) != ''
        run: |
          python3 tools/scan_type_inventory.py \
            --managed "$SOURCE_DATA/Managed" \
            --scan-report docs/scan_report.json \
            --out type_inventory

      - name: Game assembly method & lifecycle inventory
        if: hashFiles(env.SOURCE_DATA) != ''
        run: |
          python3 tools/scan_method_inventory.py \
            --managed "$SOURCE_DATA/Managed" \
            --out method_inventory

      - name: Game assembly field & enum inventory
        if: hashFiles(env.SOURCE_DATA) != ''
        run: |
          python3 tools/scan_field_inventory.py \
            --managed "$SOURCE_DATA/Managed" \
            --out field_inventory

      - name: Game assembly property & event inventory
        if: hashFiles(env.SOURCE_DATA) != ''
        run: |
          python3 tools/scan_property_event_inventory.py \
            --managed "$SOURCE_DATA/Managed" \
            --out property_event_inventory

      - name: Game assembly custom attribute inventory
        if: hashFiles(env.SOURCE_DATA) != ''
        run: |
          python3 tools/scan_attribute_inventory.py \
            --managed "$SOURCE_DATA/Managed" \
            --out attribute_inventory

      - name: Assembly reference closure & embedded resources
        if: hashFiles(env.SOURCE_DATA) != ''
        run: |
          python3 tools/scan_dependency_inventory.py \
            --managed "$SOURCE_DATA/Managed" \
            --out dependency_inventory

      - name: Interface impl & external member reference inventory
        if: hashFiles(env.SOURCE_DATA) != ''
        run: |
          python3 tools/scan_interface_member.py \
            --managed "$SOURCE_DATA/Managed" \
            --out interface_member_inventory

      - name: Metadata overview & cross-ledger consistency checks
        if: hashFiles(env.SOURCE_DATA) != ''
        run: |
          python3 tools/scan_metadata_overview.py \
            --root . --out docs

      - name: Extract shader blobs & ledger
        if: hashFiles(env.SOURCE_DATA) != ''
        run: |
          python3 tools/extract_shader_blobs.py \
            --data "$SOURCE_DATA" \
            --out shader_extract

      # blobs/*.blob 是 LZ4 压缩容器, 保真链要的是解压后的 DXBC 程序段; 这一步负责解码+切片,
      # 并产出 dxbc_ledger.json(每个 shader 的原版程序数/阶段, 作为重建验收下限)。
      - name: Shader DXBC decode & program split
        if: hashFiles(env.SOURCE_DATA) != ''
        run: |
          python3 tools/extract_dxbc_programs.py \
            --data "$SOURCE_DATA,$(dirname "$SOURCE_DATA")/../game/Stacklands_Data" \
            --out shader_extract

      # ISGN/OSGN 签名: 原版顶点输入布局 + VS输出↔PS输入链接, 是重建时"不能少一个通道"的判据
      # Pass 渲染状态(ZTest/ZWrite/Blend/Cull/Stencil/ColorMask) 决定画面而非 HLSL, 必须单独导出
      # 关键字矩阵: 关键字全集 / 互斥组 / 理论上界 ↔ 实际段数(重建不得少 keyword 名)
      - name: Shader keyword matrix
        if: hashFiles(env.SOURCE_DATA) != ''
        run: |
          python3 tools/extract_keyword_matrix.py \
            --data "$SOURCE_DATA,$(dirname "$SOURCE_DATA")/../game/Stacklands_Data" \
            --dxbc-ledger shader_extract/dxbc_ledger.json \
            --out shader_extract

      # DXBC 指令级反汇编: opcode 直方图 + dcl 绑定的 cbuffer/texture/sampler; 长度不符/未知 opcode 直接失败
      - name: DXBC disassembly profile
        if: hashFiles('shader_extract/dxbc/*.dxbc') != ''
        run: python3 tools/disassemble_dxbc.py --dxbc shader_extract/dxbc --out shader_extract

      # cbuffer 槽位映射: dcl 槽位可信, 名字只在三条前提同时成立时才落映射(否则只告警)
      - name: Cbuffer slot mapping
        if: hashFiles('shader_extract/dxbc/*.dxbc') != ''
        run: |
          python3 tools/map_cbuffer_slots.py \
            --data "$SOURCE_DATA,$(dirname "$SOURCE_DATA")/../game/Stacklands_Data" \
            --out shader_extract

      # 重建规格书: 每个 shader 一份 spec(属性/Fallback/Tags/Pass 状态/程序数/顶点布局)
      - name: Shader rebuild spec
        if: hashFiles(env.SOURCE_DATA) != ''
        run: |
          python3 tools/extract_shader_spec.py \
            --data "$SOURCE_DATA,$(dirname "$SOURCE_DATA")/../game/Stacklands_Data" \
            --ledger shader_extract --out shader_extract

      # 保真总表: 把六张台账压成"一个 shader 一行"的验收闭包, risk 非空即不可开工
      - name: Shader fidelity table
        run: python3 tools/build_fidelity_table.py --ledger shader_extract --out shader_extract

      # ShaderLab 保真校验: 自测(用台账合成正确样本+4 个变异) → 若已有重建 .shader 则逐 pass 对账
      - name: ShaderLab fidelity selftest
        run: python3 tools/verify_shaderlab_fidelity.py --selftest

      - name: ShaderLab fidelity (rebuilt shaders)
        if: hashFiles('Assets/Shaders/*.shader') != ''
        run: python3 tools/verify_shaderlab_fidelity.py --shaders Assets/Shaders --expect-shaders 20

      # 阶段语义自证: 用 OSGN 输出语义(VS 必写 SV_Position / PS 必写 SV_Target)独立证伪阶段判定,
      # 避免"文件名由 SHDR token 解码而来"的自证循环
      - name: Shader stage semantics
        if: hashFiles('shader_extract/dxbc/*.dxbc') != ''
        run: python3 tools/verify_stage_semantics.py --dxbc shader_extract/dxbc --out shader_extract

      # 变体预算对账: typetree 说应该有多少段 VS/PS, 与切出来的段数必须相等(否则链条有洞)
      - name: Shader variant reconciliation
        if: hashFiles(env.SOURCE_DATA) != ''
        run: |
          python3 tools/extract_variants.py \
            --data "$SOURCE_DATA,$(dirname "$SOURCE_DATA")/../game/Stacklands_Data" \
            --dxbc-ledger shader_extract/dxbc_ledger.json \
            --out shader_extract

      - name: Shader pass render state
        if: hashFiles(env.SOURCE_DATA) != ''
        run: |
          python3 tools/extract_pass_state.py \
            --data "$SOURCE_DATA,$(dirname "$SOURCE_DATA")/../game/Stacklands_Data" \
            --out shader_extract

      - name: Shader I/O signatures (ISGN/OSGN)
        if: hashFiles(env.SOURCE_DATA) != ''
        run: |
          python3 tools/extract_signatures.py \
            --dxbc shader_extract/dxbc \
            --out shader_extract

      - name: Shader fidelity worklist (families & diffs)
        if: hashFiles(env.SOURCE_DATA) != ''
        run: |
          python3 tools/build_shader_worklist.py \
            --ledger shader_extract/shader_ledger.json \
            --out shader_extract

      - name: Inventory config / localization / DLC / audio
        if: hashFiles(env.SOURCE_DATA) != ''
        run: |
          python3 tools/export_content_inventory.py \
            --data "$SOURCE_DATA" \
            --bundles "source/Cities_DLC/PC/cities_dlc,source/Spirits_DLC/PC/spirits_dlc" \
            --out content_inventory

      # 反编译源码落地后: IL2CPP 风险 API 扫描 (Emit/Roslyn/反射/Harmony)
      - name: IL2CPP risk scan (decompiled source)
        if: hashFiles(env.DECOMPILED_SRC) != ''
        run: |
          python3 tools/scan_il2cpp_risks.py \
            --src "$DECOMPILED_SRC" \
            --out docs/il2cpp_risks.md

      - name: Upload analysis reports & blobs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-${{ github.sha }}
          path: |
            docs/scan_report.*
            docs/il2cpp_risks.md
            blocked_metadata/
            platform_refs/
            type_inventory/
            method_inventory/
            field_inventory/
            property_event_inventory/
            attribute_inventory/
            dependency_inventory/
            interface_member_inventory/
            docs/metadata_overview.*
            docs/15_反编译落地后待办清单.md
            preflight.json
            shader_extract/
            shader_extract/dxbc/
            shader_extract/dxbc_ledger.*
            shader_extract/signature_ledger.*
            shader_extract/pass_state.*
            shader_extract/variant_ledger.*
            shader_extract/stage_semantics.*
            shader_extract/keyword_matrix.*
            shader_extract/shaderlab_fidelity.*
            shader_extract/fidelity_table.*
            shader_extract/spec/*.json
            shader_extract/asm_profile.*
            shader_extract/cbuffer_slots.*
            shader_extract/asm/*.asm
            shader_extract/spec_index.json
            content_inventory/
          if-no-files-found: ignore

  build-android:
    name: IL2CPP Android 构建
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # 仅当工程已落地 且 Personal 账号密钥已配置时才构建; 手动触发时由首步守卫给出明确原因。
    if: >-
      always() && needs.static-analysis.result == 'success' &&
      ( github.event_name == 'workflow_dispatch' ||
        ( needs.static-analysis.outputs.project_ready == 'true' &&
          needs.static-analysis.outputs.license_ready == 'true' ) )
    steps:
      - uses: actions/checkout@v4
        with:
          # 版本号 = 原版 1.5.0 + 本仓库提交数, 浅克隆拿不到真实次数
          fetch-depth: 0

      # 用 GameCI 官方 action 构建(用户规定的构建方式):
      #   game-ci/unity-builder@v4 负责 激活 + 导入 + -executeMethod + 产物收集
      # 授权优先级: UNITY_LICENSE(.ulf 全文) > UNITY_SERIAL + 邮箱密码(Plus/Pro)
      #   Personal 版官方明确不支持命令行/序列号激活, 只能用 .ulf 文件
      - name: 许可注入自检 (只打印长度, 不打印内容)
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          echo "UNITY_LICENSE 长度=${#UNITY_LICENSE}"
          case "$UNITY_LICENSE" in
            *"<LicenseFile"*|*"<?xml"*) echo "形态: 原始 ulf XML" ;;
            "") echo "::error::UNITY_LICENSE 为空"; exit 1 ;;
            *) echo "形态: 可能是 base64/其它" | head -c 60; echo ;;
          esac

      # Library 缓存: CI 每次从零导入 400+ 张 ASTC 贴图 + 219 个 shader 是主要耗时,
      # 用 Assets/Packages/ProjectSettings 的哈希做 key, 命中即跳过导入与压缩。
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: unity-library-${{ hashFiles('Assets/**/*.meta', 'Assets/**/*.cs', 'Assets/**/*.shader', 'Assets/**/*.png', 'Packages/packages-lock.json', 'ProjectSettings/**') }}
          restore-keys: |
            unity-library-

      # 版本号规则(用户指定): 原版 PC 的 1.5.0 + 本仓库修改次数, 每次构建前自动写入
      - name: 校准版本号 (原版版本号 + 修改次数)
        run: python3 tools/bump_version.py

      # Shader 渲染状态严格门: 移植 ShaderLab 的 Cull/ZTest/ZWrite/Blend/ColorMask/Stencil/Queue
      # 必须与原版序列化的 pass 状态逐项一致, 不一致直接判死(不许再靠"看着差不多")。
      - name: Shader 状态严格门 (原版 pass_state 对照)
        run: python3 tools/verify_shader_state.py --strict --md shader_extract/state_diff.md

      - name: Build Android (GameCI unity-builder)
        id: build
        # Unity 打包成功后收尾阶段会因 debugger-agent 监听失败返回 4, 包本身是好的。
        # 这里不据此判死, 交给下面的产物审计把关(没有 APK 才会失败)。
        continue-on-error: true
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # 警告基线透传到容器内的 PortBuild (docker run --env 只转发本步骤 env 块)
          STRICT_WARNINGS: ${{ env.STRICT_WARNINGS }}
          STRICT_MAX_WARNINGS: ${{ env.STRICT_MAX_WARNINGS }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildMethod: PortBuild.StrictBuild
          allowDirtyBuild: true
          versioning: None
          androidExportType: androidPackage
          androidTargetSdkVersion: ${{ env.TARGET_SDK }}
          androidMinSdkVersion: ${{ env.MIN_SDK }}
          androidKeystoreName: ${{ secrets.KEYSTORE_NAME }}
          androidKeystoreBase64: ${{ secrets.KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.KEYSTORE_PASSWORD }}
          androidKeyaliasName: ${{ secrets.KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.KEYALIAS_PASSWORD }}
          customParameters: >-
            -buildPath builds/android
            -strictBuild
            -maxWarnings ${{ env.STRICT_MAX_WARNINGS }}
      # ---- 严格审计 A: 日志 (Unity 退出码 0 不代表内容没错) ----
      - name: Strict log audit
        # 构建被跳过/未产出日志时不阻塞(产物审计仍然强制要求 APK 存在)
        if: ${{ hashFiles('out/build.log', 'build.log') != '' }}
        run: |
          log=out/build.log
          [ -f "$log" ] || log=build.log
          if [ ! -f "$log" ]; then echo "::error::找不到构建日志"; exit 1; fi
          python3 tools/strict_log_audit.py "$log" \
            --json-out out/log_audit.json \
            $( [ "${STRICT_WARNINGS}" = "1" ] && echo "--max-warnings ${LOG_WARNINGS_BASELINE}" || echo --allow-warnings )

      # ---- 图标收尾: 去掉 Unity 自动加在 Android 13 主题图标上的单色方块 logo ----
      - name: 清理启动图标单色层并重签
        run: |
          python3 -m pip install --quiet pillow
          sudo chown -R "$(id -u):$(id -g)" builds || true
          sudo chmod -R a+rwX builds || true
          apk=$(ls builds/android/*.apk 2>/dev/null | head -1)
          if [ -z "$apk" ]; then echo "::error::没有 APK 可处理"; exit 1; fi
          python3 tools/patch_launcher_icon.py "$apk"

      # ---- 严格审计 B: 产物结构 (IL2CPP 单 ABI / 元数据 / 无 Mono残留) ----
      - name: Strict artifact audit
        run: |
          art=$(find "${BUILD_PATH}" -maxdepth 2 -type f \( -name "*.apk" -o -name "*.aab" \) | head -1)
          if [ -z "$art" ]; then echo "::error::没有产物可审计"; ls -R "${BUILD_PATH}" || true; exit 1; fi
          echo "artifact: $art"
          python3 tools/verify_apk.py "$art" \
            --expect-bundle "${BUNDLE_IDENTIFIER}" \
            --json-out out/verify_apk.json

      # ---- 严格审计 B2: APK 资产自检(DLC bundle 贴图格式/脚本绑定/卡牌数, 关键 shader 是否在包内) ----
      - name: APK 资产自检 (DLC bundle / 贴图格式 / 脚本绑定)
        run: |
          art=$(find "${BUILD_PATH}" -maxdepth 2 -type f -name "*.apk" | head -1)
          python3 -m pip install --quiet UnityPy
          python3 tools/verify_apk_assets.py "$art" --strict

      # ---- 严格审计 C: Release 不允许用 Android 调试证书 ----
      - name: Reject debug keystore on release
        # 仅显式 Release 构建才卡证书; push 触发时 inputs 为空, 不能按"非 Debug 即 Release"推定。
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'Release' }}
        run: |
          art=$(find "${BUILD_PATH}" -maxdepth 2 -type f -name "*.apk" | head -1)
          if [ -z "$art" ]; then echo "::error::Release 必须有 APK 才能验签"; exit 1; fi
          if keytool -printcert -jarfile "$art" 2>/dev/null | grep -qi "CN=Android Debug"; then
            echo "::error::$art 由 Android 调试证书签名, 不能作为 Release 交付"
            exit 1
          fi
          echo "签名证书非调试证书, 通过"

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.sha }}
          path: |
            ${{ env.BUILD_PATH }}
            out/**
            out/*.json
          retention-days: 14
          if-no-files-found: warn

      - name: Upload IL2CPP symbols / metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: il2cpp-symbols-${{ github.sha }}
          path: |
            ${{ env.BUILD_PATH }}/**/symbols.zip
            ${{ env.BUILD_PATH }}/**/global-metadata.dat
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Editor logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editor-log-${{ github.sha }}
          path: |
            build.log
            out/build.log
            Logs/**
          if-no-files-found: ignore
