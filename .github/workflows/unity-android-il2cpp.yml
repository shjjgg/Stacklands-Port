name: unity-android-il2cpp

# Stacklands 移植 · GitHub Actions + GameCI
# 引擎锁定 2022.3.4f1, 目标 Android IL2CPP (arm64-v8a)
# 说明: 带 <...> 的值需按仓库实际填写; 密钥走 GitHub Secrets, 不要入库。

on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Debug / Release"
        default: "Release"
        type: choice
        options: [ Debug, Release ]

env:
  UNITY_VERSION: 2022.3.4f1
  BUILD_TARGET: Android
  IL2CPP: true
  ARCH: arm64-v8a
  PROJECT_PATH: .
  BUILD_PATH: builds/android
  # 源数据目录(原版 .assets / Managed / DLC bundle)。原版版权二进制不入库,
  # 通过 CI artifact 或受保护目录注入; 留空则跳过依赖源数据的扫描。
  SOURCE_DATA: source/Stacklands_Data
  SOURCE_RAW: source/raw
  DECOMPILED_SRC: Assets/Scripts
  # 移植包配置(原版值未解出前用占位/默认; 由仓库 Variables 覆盖, 不改工作流)
  BUNDLE_IDENTIFIER: ${{ vars.BUNDLE_IDENTIFIER || 'com.sokpop.stacklands.port' }}
  SCREEN_ORIENTATION: ${{ vars.SCREEN_ORIENTATION || 'LandscapeLeft' }}
  MIN_SDK: ${{ vars.MIN_SDK || '26' }}
  TARGET_SDK: ${{ vars.TARGET_SDK || 'auto' }}

jobs:
  static-analysis:
    name: 静态分析与台账提取
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.recon.outputs.ready }}
      project_ready: ${{ steps.preflight.outputs.project_ready }}
      license_ready: ${{ steps.preflight.outputs.license_ready }}
    steps:
      - uses: actions/checkout@v4

      # 构建前置探测: 工程是否已落地 (ProjectSettings/ProjectVersion.txt)、
      # Unity PERSONAL 账号密钥是否已配置 (UNITY_EMAIL / UNITY_PASSWORD)。
      # 未就绪则 build-android 自动跳过, 不产生无意义的红叉。
      - name: Preflight (project & license readiness)
        id: preflight
        continue-on-error: true
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          pr=false; [ -f ProjectSettings/ProjectVersion.txt ] && pr=true
          lr=false; [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ] && lr=true
          echo "project_ready=$pr" >> "$GITHUB_OUTPUT"
          echo "license_ready=$lr" >> "$GITHUB_OUTPUT"
          echo "engine=$(cat ProjectSettings/ProjectVersion.txt 2>/dev/null | head -1)"
          echo "project_ready=$pr license_ready=$lr"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanner deps
        run: pip install UnityPy dnfile

      # 可选: 原始上传件分卷拼接/侧车归位。仅当 SOURCE_RAW 有原始压缩包时执行。
      - name: Reconstruct source (optional)
        id: recon
        if: hashFiles(env.SOURCE_RAW) != ''
        run: |
          python3 tools/reconstruct_source.py \
            --in "$SOURCE_RAW" --out source/recon
          echo "ready=$(jq -r .ready source/recon/reconstruct_report.json)" >> "$GITHUB_OUTPUT"

      - name: Static scan (assets metadata)
        if: hashFiles(env.SOURCE_DATA) != ''
        run: |
          python3 tools/scan_static.py \
            --data "$SOURCE_DATA" \
            --managed "$SOURCE_DATA/Managed" \
            --out docs/scan_report.md \
            --json docs/scan_report.json

      - name: Blocked subsystem / native PInvoke metadata scan
        if: hashFiles(env.SOURCE_DATA) != ''
        run: |
          python3 tools/scan_blocked_metadata.py \
            --managed "$SOURCE_DATA/Managed" \
            --out blocked_metadata

      - name: Platform service references (Steam / Google)
        if: hashFiles(env.SOURCE_DATA) != ''
        run: |
          python3 tools/scan_platform_refs.py \
            --managed "$SOURCE_DATA/Managed" \
            --out platform_refs

      - name: Game assembly type inventory
        if: hashFiles(env.SOURCE_DATA) != ''
        run: |
          python3 tools/scan_type_inventory.py \
            --managed "$SOURCE_DATA/Managed" \
            --scan-report docs/scan_report.json \
            --out type_inventory

      - name: Game assembly method & lifecycle inventory
        if: hashFiles(env.SOURCE_DATA) != ''
        run: |
          python3 tools/scan_method_inventory.py \
            --managed "$SOURCE_DATA/Managed" \
            --out method_inventory

      - name: Game assembly field & enum inventory
        if: hashFiles(env.SOURCE_DATA) != ''
        run: |
          python3 tools/scan_field_inventory.py \
            --managed "$SOURCE_DATA/Managed" \
            --out field_inventory

      - name: Game assembly property & event inventory
        if: hashFiles(env.SOURCE_DATA) != ''
        run: |
          python3 tools/scan_property_event_inventory.py \
            --managed "$SOURCE_DATA/Managed" \
            --out property_event_inventory

      - name: Game assembly custom attribute inventory
        if: hashFiles(env.SOURCE_DATA) != ''
        run: |
          python3 tools/scan_attribute_inventory.py \
            --managed "$SOURCE_DATA/Managed" \
            --out attribute_inventory

      - name: Assembly reference closure & embedded resources
        if: hashFiles(env.SOURCE_DATA) != ''
        run: |
          python3 tools/scan_dependency_inventory.py \
            --managed "$SOURCE_DATA/Managed" \
            --out dependency_inventory

      - name: Interface impl & external member reference inventory
        if: hashFiles(env.SOURCE_DATA) != ''
        run: |
          python3 tools/scan_interface_member.py \
            --managed "$SOURCE_DATA/Managed" \
            --out interface_member_inventory

      - name: Metadata overview & cross-ledger consistency checks
        if: hashFiles(env.SOURCE_DATA) != ''
        run: |
          python3 tools/scan_metadata_overview.py \
            --root . --out docs

      - name: Extract shader blobs & ledger
        if: hashFiles(env.SOURCE_DATA) != ''
        run: |
          python3 tools/extract_shader_blobs.py \
            --data "$SOURCE_DATA" \
            --out shader_extract

      - name: Inventory config / localization / DLC / audio
        if: hashFiles(env.SOURCE_DATA) != ''
        run: |
          python3 tools/export_content_inventory.py \
            --data "$SOURCE_DATA" \
            --bundles "source/Cities_DLC/PC/cities_dlc,source/Spirits_DLC/PC/spirits_dlc" \
            --out content_inventory

      # 反编译源码落地后: IL2CPP 风险 API 扫描 (Emit/Roslyn/反射/Harmony)
      - name: IL2CPP risk scan (decompiled source)
        if: hashFiles(env.DECOMPILED_SRC) != ''
        run: |
          python3 tools/scan_il2cpp_risks.py \
            --src "$DECOMPILED_SRC" \
            --out docs/il2cpp_risks.md

      - name: Upload analysis reports & blobs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-${{ github.sha }}
          path: |
            docs/scan_report.*
            docs/il2cpp_risks.md
            blocked_metadata/
            platform_refs/
            type_inventory/
            method_inventory/
            field_inventory/
            property_event_inventory/
            attribute_inventory/
            dependency_inventory/
            interface_member_inventory/
            docs/metadata_overview.*
            docs/15_反编译落地后待办清单.md
            shader_extract/
            content_inventory/
          if-no-files-found: ignore

  build-android:
    name: IL2CPP Android 构建
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # 仅当工程已落地 且 Personal 账号密钥已配置时才构建; 手动触发时由首步守卫给出明确原因。
    if: >-
      always() && needs.static-analysis.result == 'success' &&
      ( github.event_name == 'workflow_dispatch' ||
        ( needs.static-analysis.outputs.project_ready == 'true' &&
          needs.static-analysis.outputs.license_ready == 'true' ) )
    steps:
      - uses: actions/checkout@v4

      # Unity PERSONAL 版授权只能账号在线激活: 不用 game-ci/unity-activate@v4
      # (该 action 只支持 UNITY_LICENSE 文件 / UNITY_SERIAL 序列号策略), 改为在
      # GameCI 编辑器镜像内直接调用 Unity.Licensing.Client 激活, 与仓库既有的
      # 个人版构建流程一致。密钥: Settings → Secrets → UNITY_EMAIL / UNITY_PASSWORD。
      - name: Preflight guard
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ ! -f ProjectSettings/ProjectVersion.txt ]; then
            echo "::error::工程尚未落地 (缺 ProjectSettings/ProjectVersion.txt), 无法构建; 先按 docs/15 T1 完成 AssetRipper 导出。"
            exit 1
          fi
          eng=$(sed -n 's/^m_EditorVersion: *//p' ProjectSettings/ProjectVersion.txt | head -1)
          echo "project engine: $eng / baseline: $UNITY_VERSION"
          if [ "$eng" != "$UNITY_VERSION" ]; then
            echo "::error::引擎版本漂移: 工程 $eng, 基线 $UNITY_VERSION (禁止跨大版本)。"
            exit 1
          fi
          if [ ! -f Assets/Editor/PortBuild.cs ]; then
            echo "::error::缺少 Assets/Editor/PortBuild.cs, -executeMethod 会直接失败。"
            exit 1
          fi
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::缺少 UNITY_EMAIL / UNITY_PASSWORD, Personal 版无法在线激活。"
            exit 1
          fi

      - name: Restore Library cache
        uses: actions/cache@v4
        with:
          path: |
            Library
            ${{ env.BUILD_PATH }}
          key: ${{ runner.os }}-unity-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'ProjectSettings/**', 'Packages/**') }}
          restore-keys: |
            ${{ runner.os }}-unity-${{ env.UNITY_VERSION }}-

      - name: Build Android in GameCI image (Personal license)
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          KEYSTORE_NAME: ${{ secrets.KEYSTORE_NAME }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYALIAS_NAME: ${{ secrets.KEYALIAS_NAME }}
          KEYALIAS_PASSWORD: ${{ secrets.KEYALIAS_PASSWORD }}
        run: |
          mkdir -p out
          set +e
          docker run --rm \
            -v "$PWD":/project \
            -v "$PWD/out":/out \
            -e UNITY_EMAIL -e UNITY_PASSWORD \
            -e KEYSTORE_NAME -e KEYSTORE_PASSWORD \
            -e KEYALIAS_NAME -e KEYALIAS_PASSWORD \
            -e BUILD_VERSION=0.1.0 \
            -e BUNDLE_VERSION_CODE="${{ github.run_number }}" \
            -e BUILD_AAB=0 \
            -e BUILD_TYPE=Release \
            -e BUNDLE_IDENTIFIER \
            -e SCREEN_ORIENTATION \
            -e MIN_SDK \
            -e TARGET_SDK \
            -e BUILD_PATH=builds/android \
            -e HOME=/root \
            -w /project \
            --entrypoint bash \
            unityci/editor:ubuntu-2022.3.4f1-android-3 \
            -c '
              set -euo pipefail
              LC=/opt/unity/Editor/Data/Resources/Licensing/Client/Unity.Licensing.Client
              "$LC" --activate-all --include-personal \
                --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD"
              echo "=== license files ==="
              ls -la /root/.config/unity3d/Unity/licenses 2>/dev/null || true
              echo "=== build (IL2CPP arm64-v8a) ==="
              set +e
              /opt/unity/Editor/Unity -batchmode -nographics -quit \
                -projectPath /project \
                -executeMethod PortBuild.PerformAndroidBuild \
                -logFile /project/build.log
              echo $? > /project/unity.exit
              set -e
              echo "=== outputs ==="
              find /project/$BUILD_PATH -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.obb" \) 2>/dev/null || true
            '
          code=$(cat unity.exit 2>/dev/null | tr -dc "0-9")
          cp -v build.log out/ 2>/dev/null || true
          # shader 编译错误在 Unity 里只写日志、不让 exit code 非 0, 这里显式统计
          errs=$(grep -c "Shader error in" build.log 2>/dev/null || true)
          echo "shader compile errors: ${errs:-0}"
          grep -m 20 "Shader error in" build.log 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" . || true
          echo "unity exit code: ${code:-missing}"
          if [ "${code:-1}" != "0" ]; then exit 1; fi
          if [ "${errs:-0}" != "0" ]; then echo "::error::shader compile errors present"; exit 1; fi

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.sha }}
          path: |
            ${{ env.BUILD_PATH }}
            out/**
          retention-days: 14
          if-no-files-found: warn

      - name: Upload IL2CPP symbols / metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: il2cpp-symbols-${{ github.sha }}
          path: |
            ${{ env.BUILD_PATH }}/**/symbols.zip
            ${{ env.BUILD_PATH }}/**/global-metadata.dat
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Editor logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editor-log-${{ github.sha }}
          path: |
            build.log
            out/build.log
            Logs/**
          if-no-files-found: ignore
